[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "anthropic>=0.28",
    "structlog>=24.1",
    "langgraph>=0.1",
    "google-genai>=2.9.0",
    "openai>=2.53.0",
    "jsonschema>=4.26.0",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
    "cryptography>=49.0.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
# `slow` is excluded by default so the per-commit gate stays fast. The full
# 220-thread real-LLM run is opt-in: `uv run pytest -m slow tests/integration`.
addopts = "-m 'not slow'"
markers = [
    "integration: hits a real external API using keys from .env",
    "slow: the full 220-thread real-LLM gate (minutes); excluded by default, run with -m slow",
]
